# One duplex profile: changing a microphone port must not replace the sink.
[General]
auto-profiles = no

[Mapping pinetabv-output]
description = Built-in Audio
device-strings = hw:%f,1
channel-map = left,right
direction = output
paths-output = pinetabv-output-speaker pinetabv-output-headphones pinetabv-output-off

[Mapping pinetabv-input]
description = Built-in Audio
device-strings = hw:%f,0
channel-map = left,right
direction = input
paths-input = pinetabv-input-internal-mic pinetabv-input-headset-mic pinetabv-input-off

[Profile HiFi]
description = Play and capture HiFi audio
output-mappings = pinetabv-output
input-mappings = pinetabv-input
priority = 100
skip-probe = no
