type = speaker
priority = 100
[Jack Headphones]
state.plugged = no
state.unplugged = unknown
# Keep analog bypasses off: only the digital DAC may drive the outputs.
[Element Left Headphone Mixer LLIN]
switch = off
[Element Right Headphone Mixer RLIN]
switch = off
[Element DAC Soft Ramp]
switch = on
[Element Internal Speakers]
required = switch
switch = on
[Element Left Headphone Mixer Left DAC]
required = switch
switch = on
[Element Right Headphone Mixer Right DAC]
required = switch
switch = on
# Fixed codec gain; PipeWire applies the user's volume in software.
[Element Headphone]
volume = 3
[Element Headphone Mixer]
volume = 11
[Element DAC]
volume = 192
