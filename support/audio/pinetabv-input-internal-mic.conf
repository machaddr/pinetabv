# PineTab-V capture only; never change playback controls here.
# There is no microphone-presence detector. Keep both choices available.
[General]
description = Internal Microphone
type = mic
priority = 200
[Element Headset Microphone]
required = switch
# ASoC DAPM pin switches have no Capture suffix and are playback controls.
direction = playback
switch = off
[Element Internal Microphone]
required = switch
direction = playback
switch = on
[Element ADC]
volume = 192
[Element ADC PGA Gain]
volume = 7
[Element ALC]
switch = off
[Element Differential Mux]
required = enumeration
enumeration = select
[Option Differential Mux:lin2-rin2]
name = internal-mic
